# ═══════════════════════════════════════════════════════
# Voxtral-Mini-4B-Realtime-2602 (vLLM realtime serve)
# ═══════════════════════════════════════════════════════
#
# 대상 GPU: L40S 46GB × 1 (GPU 2 단독)
# 외부 노출: stt/gateways/5017.yaml (게이트웨이 :5017 → 본 인스턴스 :7172)
# 엔드포인트:
#   - POST /v1/audio/transcriptions  (OpenAI Audio API)
#   - POST /v1/audio/translations
#   - WS   /v1/realtime              (OpenAI Realtime API, WebSocket)
#
# 역할: 한국어 포함 13개 언어 실시간 STT (스트리밍/저지연).
# 모델 크기: 4B params (LM ~3.4B + Audio Encoder ~970M, BF16)
# 토큰-시간 비율: 1 text token = 80ms 오디오
#
# 사용법:
#   ./start.sh up voxtral                                   # 본 인스턴스만 단독 기동
#   ./start.sh up                                           # 전체 STT 클러스터 (인스턴스+게이트웨이)
#   python ../vllm/vllm_server_launcher.py \                # 직접 실행
#       -c instances/voxtral.yaml -g 2
#
# 모델카드 권장 (https://huggingface.co/mistralai/Voxtral-Mini-4B-Realtime-2602):
#   VLLM_DISABLE_COMPILE_CACHE=1 vllm serve <model> \
#     --compilation_config '{"cudagraph_mode": "PIECEWISE"}'
#   → env / compilation_config 모두 본 yaml에 반영.
#
# ※ 이 config는 vllm/vllm_server_launcher.py 가 그대로 소비한다.
#    `gpus` / `download_dir` / `env` / `gateway_port` 키는 런처가 처리하고
#    vllm serve로는 전달되지 않는다.
# ═══════════════════════════════════════════════════════


# ── 메타 (vLLM에는 전달되지 않는 게이트웨이 매칭용 키) ──
#
# 이 인스턴스가 소속될 게이트웨이 포트.
# gateways/5017.yaml의 discover_from(../instances)이 본 yaml의 gateway_port를 보고
# 자기 게이트웨이 포트(5017)와 일치하면 backends에 등록한다.
# vllm_server_launcher.py:_LAUNCHER_KEYS가 이 키를 vllm serve 인자에서 제외한다.
gateway_port: 5017


# ── 모델 ──────────────────────────────────────────────
# HF ID. 런처가 download_dir과 조합하여 로컬 경로로 자동 해석한다.
# 미존재 시 snapshot_download로 자동 다운로드. Apache 2.0 → HF_TOKEN 불필요.
model: mistralai/Voxtral-Mini-4B-Realtime-2602

# STT/오디오 모델 전용 저장 루트 (LLM과 분리하여 디스크 관리 단순화).
download_dir: /models/STT


# ── 환경변수 (런처가 vllm 자식 프로세스에 export) ─────
# 모델카드 권장: cudagraph 컴파일 캐시 비활성화 → 첫 기동 안정성 우선.
# vllm_server_launcher.py가 _LAUNCHER_KEYS로 인식하여 vllm serve에는 전달하지 않고
# subprocess.Popen의 env에 머지한다.
env:
  VLLM_DISABLE_COMPILE_CACHE: "1"


# ── 작업 유형 ─────────────────────────────────────────
# Voxtral-Realtime은 /v1/realtime 엔드포인트(WebSocket 스트리밍) 위주.
# 모델카드 권장 launch에는 --task 미지정 → vLLM 자동 감지에 맡긴다.
# 자동 감지 결과가 부정확하면 명시 (transcription | realtime) 후 재기동.
# task: transcription


# ── 서버 ──────────────────────────────────────────────
host: 0.0.0.0
# port = 내부 vLLM 포트 (게이트웨이 ↔ 인스턴스 사이의 hop). 외부 클라이언트는
# stt/gateways/5017.yaml(:5017)으로 접속하고 게이트웨이가 본 포트로 forward한다.
# 7172는 vllm 측 7070(gemma)/7080(qwen) 다음 자리. 사용 중이면 launcher가 자동 회피(+1).
port: 7172
uvicorn_log_level: info


# ── GPU / 메모리 ──────────────────────────────────────
# 단일 GPU 단독 사용. start.sh가 -g 인자로 CUDA_VISIBLE_DEVICES 설정.
gpus: [2]
tensor_parallel_size: 1

# Voxtral-Mini-4B BF16 가중치 8.38 GiB (실측) + audio encoder + KV cache.
# 단일 세션 PoC 기준 핏 (실측 1차 0.50 = 23 GiB 예약 → 실사용 19.3 GiB → 4 GiB 과대):
#   0.35 = 16.1 GiB 예약  →  weight 8.38 + KV ~4 GiB + cudagraph + 외부 활성화 = 안정 영역
# 동시 N 세션 운영으로 전환 시 0.40 (+max_num_seqs=2~3) 또는 0.50 (+max_num_seqs=4)로 상향.
gpu_memory_utilization: 0.35


# ── 추론 ──────────────────────────────────────────────
# 모델카드 기본 max_model_len=131072 (~3시간 오디오, 1 token ≈ 80ms).
# 1시간 녹음 처리에 모델카드 최소 권장값은 45000.
# 운영 시작은 보수적 32768 (≈ 43분 오디오)로 두고, 장시간 워크로드 등장 시 상향.
max_model_len: 32768

# 동시 처리 시퀀스 수 (실시간 스트림 동시성 상한).
# vLLM은 continuous batching이라 N개를 batched parallel로 처리하지만,
# KV cache 슬롯이 부족하면 preemption(swap out)이 발생해 사실상 일부 순차화된다.
# 단일 세션 PoC에서는 1로 충분. 동시 N 세션 운영 시 KV(=gpu_memory_utilization)와 함께 상향.
max_num_seqs: 1

# BF16 자동 감지.
dtype: auto

# 재현 가능한 추론.
seed: 42


# ── 컴파일 / 그래프 ───────────────────────────────────
# 모델카드 권장: PIECEWISE cudagraph 모드.
# 첫 기동 시 cudagraph 캡처 단계의 안정성 우선 (env의 VLLM_DISABLE_COMPILE_CACHE=1과 짝).
# vLLM은 이 dict를 CompilationConfig dataclass로 자동 변환한다.
compilation_config:
  cudagraph_mode: PIECEWISE


# ── 로깅 ──────────────────────────────────────────────
enable_log_requests: false
disable_log_stats: false
