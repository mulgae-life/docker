# vLLM STT Instance — 인스턴스 1대(vLLM 프로세스 1대, 런처가 소비). 키 상세: ./_SCHEMA.txt
# 복붙 후 값만 바꾼다: gateway_port, model, host, port, gpus, gpu_memory_utilization,
#   max_model_len, max_num_seqs, env, task, compilation_config (모델별 — _SCHEMA.txt 표 참조).

# 게이트웨이 매칭 키 (vLLM 비전달; 같은 포트 다중이면 게이트웨이가 model 필드로 라우팅)
gateway_port: 5017

# 모델 (HF ID — 런처가 download_dir과 조합해 경로 해석, 미존재 시 자동 다운로드)
model: Qwen/Qwen3-ASR-1.7B
download_dir: /models/STT        # STT 전용 저장 루트 (LLM과 분리)

# 환경변수 (런처가 vllm 자식에 export — _LAUNCHER_KEYS, vllm serve 미전달)
# env:                           # qwen3_asr 미사용 (voxtral만 VLLM_DISABLE_COMPILE_CACHE=1)
#   VLLM_DISABLE_COMPILE_CACHE: "1"

# 작업 유형 (transcription=audio 엔드포인트 활성 / 미지정=자동감지·realtime 동시노출)
task: transcription              # ASR 엔드포인트 활성 (모델카드 권장)

# 서버
host: 0.0.0.0                    # 바인딩 (게이트웨이가 이 포트로 forward)
port: 7170                       # vLLM 포트 hint (사용 중이면 launcher가 +1 자동 회피)
uvicorn_log_level: info          # HTTP 서버 로그 레벨

# GPU / 메모리 (단일 GPU 단독, TP 없음 — start.sh -g가 CUDA_VISIBLE_DEVICES 설정)
gpus: [0]                        # 사용 GPU 번호
tensor_parallel_size: 1          # 텐서 병렬 (STT는 1)
gpu_memory_utilization: 0.5      # 가중치+KV+cudagraph+활성화 (모델별 실측, _SCHEMA.txt)

# 추론
max_model_len: 8192              # 컨텍스트 (오디오 길이 비례, 1 token≈80ms)
max_num_seqs: 8                  # 동시 시퀀스 (PoC; 운영 N세션은 util과 동기 상향)
dtype: auto                      # 활성화 dtype (BF16 자동)
seed: 42                         # 재현용 시드

# 컴파일 / 그래프 (voxtral PIECEWISE 모델카드 권장 — env와 짝)
# compilation_config:            # qwen3_asr 미사용 (voxtral만 PIECEWISE)
#   cudagraph_mode: PIECEWISE

# 로깅
enable_log_requests: false       # 요청별 로그 (운영 false)
disable_log_stats: false         # 처리량/지연 통계 (false=출력)
