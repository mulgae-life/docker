# STT Gateway — 게이트웨이 1대 (vllm_gateway 본체 재사용: chat/transcription/realtime, model 필드 라우팅). 키 상세: ./_SCHEMA.txt
# 복붙 후 gateway.host/port만 바꾼다. discover_from이 gateway_port 일치 인스턴스를 자동 등록.

# 게이트웨이 서버
gateway:
  host: "0.0.0.0"             # 바인딩 (외부 0.0.0.0 / 내부 127.0.0.1)
  port: 5018                   # 진입 포트 (방화벽 오픈 대상)
  log_level: "info"            # 로그 레벨 (info / debug)

# 백엔드 자동 디스커버리 (gateway_port 일치 인스턴스 등록)
discover_from: "../instances"

# 헬스체크
health_check:
  interval_seconds: 10         # /health 확인 주기
  timeout_seconds: 3           # /health 1회 타임아웃
  unhealthy_threshold: 3       # 연속 실패 N회 → unhealthy
  healthy_threshold: 1         # 연속 성공 N회 → 복구

# 서버 웜업 (STT는 chat dummy 추론 불가 → 비활성, /health 프로브만)
warmup:
  enabled: false               # STT 비활성 (cudagraph 첫 호출 자동 capture)
  boot_poll:
    interval_seconds: 5        # 백엔드 기동 폴링 간격
    timeout_seconds: 900       # 모델 로딩 포함 기동 대기 상한
  inference:
    prompt: "(STT 게이트웨이는 inference 웜업 미사용)"   # 미사용 placeholder (모델 검증용)
    max_tokens: 1              # 미사용
    timeout_seconds: 10        # 미사용

# 프리픽스 캐시 웜업 (STT는 chat 시스템 프롬프트 패턴 무관 → 비활성)
prefix_cache_warmup:
  enabled: false               # STT 비활성
  max_tokens: 1                # 미사용
  timeout_seconds: 10          # 미사용
  system_prompt: "(STT 게이트웨이는 프리픽스 캐시 웜업 미사용)"   # 미사용 placeholder

# 백엔드 인증 — vLLM --api-key 사용 시 (기본 미사용, 내부망)
# backend_api_key: "your-secret-key"

# HTTP 클라이언트 (audio는 길이 비례 → chat 300s보다 길게)
http_client:
  timeout_seconds: 600         # 백엔드 요청 전체 (audio _AUDIO_TIMEOUT_SECONDS=600)
  connect_timeout_seconds: 5   # TCP 연결 타임아웃
  max_connections: 50          # 연결 풀 상한 (실제 제한은 overload)

# 과부하 차단
overload:
  enabled: true                # 동시 처리량/대기열 제한
  max_inflight_requests: 20    # 즉시 백엔드로 넘길 최대 요청 (단일 max_num_seqs 이하 권장)
  max_queue_size: 40           # 추가 대기 허용 요청 수
  queue_timeout_seconds: 180   # 슬롯 대기 최대 시간 → 초과 시 429
  retry_after_seconds: 10      # 429 Retry-After 값
