# vLLM Gateway — 게이트웨이 1대. 키 상세: ./_SCHEMA.txt
# 복붙 후 gateway.host/port만 바꾼다. discover_from이 gateway_port 일치 인스턴스를 자동 등록.

# 게이트웨이 서버
gateway:
  host: "127.0.0.1"            # 바인딩 (외부 0.0.0.0 / 내부 127.0.0.1)
  port: 6016                   # 진입 포트 (방화벽 오픈 대상)
  log_level: "info"            # 로그 레벨 (info / debug)

# 백엔드 자동 디스커버리 (gateway_port 일치 인스턴스 등록)
discover_from: "../instances"

# 헬스체크
health_check:
  interval_seconds: 10         # /health 확인 주기
  timeout_seconds: 3           # /health 1회 타임아웃
  unhealthy_threshold: 3       # 연속 실패 N회 → unhealthy
  healthy_threshold: 1         # 연속 성공 N회 → 복구

# 서버 웜업 (CUDA 예열)
warmup:
  enabled: true                # 시작/복구 시 더미 추론 예열
  boot_poll:
    interval_seconds: 5        # 백엔드 기동 폴링 간격
    timeout_seconds: 900       # 모델 로딩 포함 기동 대기 상한
  inference:
    prompt: "자동차보험 대인배상 담보에 대해 상세히 설명해주세요."  # 예열 프롬프트
    max_tokens: 256            # 예열 생성 토큰 수
    timeout_seconds: 120       # 예열 요청 타임아웃

# 프리픽스 캐시 웜업 (공통 시스템 프롬프트 KV 적재)
prefix_cache_warmup:
  enabled: true                # 프리픽스 캐시 예열 여부
  max_tokens: 1                # 적재 확인용 생성 토큰 수
  timeout_seconds: 60          # 웜업 요청 타임아웃
  system_prompt: |             # 서비스 공통 시스템 프롬프트
    당신은 한화손해보험의 전문 AI 어시스턴트입니다.
    보험 상품, 담보, 청구 절차 등에 대해 정확하고 친절하게 답변합니다.

# 백엔드 인증 — vLLM --api-key 사용 시 (기본 미사용)
# backend_api_key: "your-secret-key"

# HTTP 클라이언트
http_client:
  timeout_seconds: 300         # 백엔드 추론 전체 타임아웃
  connect_timeout_seconds: 5   # TCP 연결 타임아웃
  max_connections: 100         # 연결 풀 상한 (실제 제한은 overload)

# 과부하 차단
overload:
  enabled: true                # 동시 처리량/대기열 제한
  max_inflight_requests: 20    # 즉시 백엔드로 넘길 최대 요청 (단일 max_num_seqs 이하 권장)
  max_queue_size: 40           # 추가 대기 허용 요청 수
  queue_timeout_seconds: 180   # 슬롯 대기 최대 시간 → 초과 시 429
  retry_after_seconds: 10      # 429 Retry-After 값
