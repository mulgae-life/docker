# PII Proxy — 프록시 1대. 외부 단일 포트를 인수하고 게이트웨이를 내부로 물린다(enforcement). 키 상세: ./_SCHEMA.txt
# 복붙 후 값만 바꾼다: port, upstream_url, ner_require_all_backends(연구 false/운영 true), audit_log_path.

# 프록시 바인딩 (외부 유일 입구)
host: "0.0.0.0"                          # 외부 노출 (유일 입구)
port: 5502                               # 외부 진입 포트

# upstream 게이트웨이 (내부 전용 127.0.0.1)
upstream_url: "http://127.0.0.1:6502"    # 검사 후 포워딩할 내부 게이트웨이

# NER LB 풀 (GPU3, multi-model union — 확장은 같은 model_tag 포트 추가)
ner_backends:
  - { host: "127.0.0.1", port: 8911, model_tag: "vmaca123" }   # 3축(이름/주소/조직)
  - { host: "127.0.0.1", port: 8901, model_tag: "townboy" }    # 광범위(정형 안전망)

# 검사 토글 (in=프롬프트, out=응답)
in_enabled: true
out_enabled: true

# 장애 모드: closed(차단, 컴플라이언스) / open(통과) — open도 구조화 regex는 항상 적용
fail_mode: "closed"

# 전면 우회: true면 헤더 X-PII-Mode:bypass로 검사 생략 (토큰 미설정 시 헤더만으로 우회)
allow_bypass: true

# NER 부분 장애 시 fail-closed: 연구 false / 운영 true (컴플라이언스, 커버리지 손실 방지)
ner_require_all_backends: true

# 스트리밍 out: post(완결 후 1회 검사, 구조 보존) / off(패스스루)
stream_mode: "post"

# 차단 타입 (그 외는 마스킹)
block_types: ["rrn", "card"]

# 이미지 정책: allow(텍스트만 검사) / block(이미지 포함 요청 422 차단)
image_policy: "allow"

# 서비스별 마스킹 토글 화이트리스트 (헤더 X-PII-Ignore-Types — 핵심 PII는 불가)
ignorable_types: ["org"]

# 타임아웃(초)
ner_connect_timeout: 1.0                 # NER 연결
ner_read_timeout: 3.0                    # NER 읽기
upstream_timeout: 300.0                  # 게이트웨이 추론

# 감사로그 (평문 미저장, salt는 env PII_AUDIT_SALT). 포트별 파일 분리.
audit_log_path: "logs/pii_audit.5502.log"
