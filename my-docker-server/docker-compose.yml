services:
  cfd:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        USERNAME: ${USERNAME}
        PASSWORD: ${PASSWORD}
        UID: ${UID:-2000}
        GID: ${GID:-2000}
    image: cfd-gpu
    container_name: cfd
    hostname: cfd
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    ports:
      - "5000:22"              # SSH
      - "5001-5009:5001-5009"  # 서비스
    volumes:
      - /workspace:/workspace
      - /opt/docker-homes/cfd/${USERNAME}:/home/${USERNAME}
      - /opt/docker-homes/cfd/ssh-hostkeys:/etc/ssh/hostkeys  # 재빌드 후에도 SSH 호스트 키 유지
    deploy:
      resources:
        limits:
          memory: 24g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USERNAME: ${USERNAME}
        PASSWORD: ${PASSWORD}
        UID: ${UID:-2000}
        GID: ${GID:-2000}
    image: dev-fullstack
    container_name: dev-fullstack
    hostname: dev-fullstack
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    ports:
      - "5010:22"              # SSH
      - "5011-5019:5011-5019"  # 서비스
    volumes:
      - /workspace:/workspace
      - /opt/docker-homes/dev/${USERNAME}:/home/${USERNAME}
      - /opt/docker-homes/dev/ssh-hostkeys:/etc/ssh/hostkeys  # 재빌드 후에도 SSH 호스트 키 유지
    deploy:
      resources:
        limits:
          memory: 24g
